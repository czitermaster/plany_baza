<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plany Kształcenia</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }

      header {
        background-color: #4a90e2;
        color: white;
        padding: 1rem;
        text-align: center;
        font-size: 1.5rem;
      }

      .container {
        display: flex;
        height: calc(100vh - 72px);
      }

      .sidebar {
        width: 220px;
        background-color: #f0f0f0;
        padding: 1rem;
        box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
      }

      .sidebar button {
        display: block;
        width: 100%;
        margin-bottom: 0.5rem;
        padding: 0.5rem;
        background-color: #fff;
        border: 1px solid #ccc;
        border-radius: 5px;
        cursor: pointer;
      }

      .sidebar button:hover {
        background-color: #e0e0e0;
      }

      main {
        flex-grow: 1;
        padding: 1rem;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Plany Kształcenia</h1>
    </header>

    <div class="container">
      <aside class="sidebar">
        <button onclick="loadSection('students')">Studenci</button>
        <button onclick="loadSection('plans')">Plany</button>
        <button onclick="loadSection('subjects')">Przedmioty</button>
        <button onclick="loadSection('fields')">Kierunki</button>
        <button onclick="loadSection('lecturers')">Wykładowcy</button>
      </aside>

      <main id="main-content">
        <p>Wybierz sekcję z menu po lewej stronie.</p>
      </main>
    </div>

    <script>
      const API_BASE = 'http://localhost:3000' // Dostosuj jeśli port/backend inny

      async function loadSection(section) {
        const endpointMap = {
          students: '/students',
          plans: '/plans',
          subjects: '/subjects',
          fields: '/fields',
          lecturers: '/lecturers'
        }

        const content = document.getElementById('main-content')
        content.innerHTML = `<p>Ładowanie danych z sekcji: ${section}...</p>`

        try {
          const res = await fetch(API_BASE + endpointMap[section])
          if (!res.ok) throw new Error('Błąd odpowiedzi serwera')

          const data = await res.json()
          if (!Array.isArray(data)) {
            content.innerHTML = '<p>Otrzymano nieprawidłowe dane.</p>'
            return
          }

          content.innerHTML =
            `<h2>${section.charAt(0).toUpperCase() + section.slice(1)}</h2>` +
            `<ul>` +
            data.map((item) => `<li>${JSON.stringify(item)}</li>`).join('') +
            `</ul>`
        } catch (err) {
          content.innerHTML = `<p>Błąd podczas ładowania danych: ${err.message}</p>`
        }
      }
    </script>
  </body>
</html>
